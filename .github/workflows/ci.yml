name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Verify protected blueprint files
        run: sha256sum -c docs/blueprint/PROTECTED.sha256

      - name: Run ruff check
        run: ruff check

      - name: Run ruff format check
        run: ruff format --check

      - name: Run mypy
        run: mypy --strict src

      - name: Run pytest
        run: pytest -q

      - name: Run shellcheck
        run: |
          mapfile -t sh_files < <(find . -name "*.sh" -not -path "*/.*/*")
          if [ "${#sh_files[@]}" -gt 0 ]; then
            shellcheck "${sh_files[@]}"
          fi
