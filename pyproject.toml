[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hostkeeper"
version = "0.3.0"
description = "Server setup and maintenance tool for Debian/Ubuntu"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "pyyaml",
    "types-PyYAML",
]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = [
    "docs/blueprint",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.10"
platform = "linux"
strict = true
packages = ["hostkeeper"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
