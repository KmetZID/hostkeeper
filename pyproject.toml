[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hostkeeper"
version = "0.3.0"
description = "Server setup and maintenance tool for Debian/Ubuntu"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "MetzID" },
]
requires-python = ">=3.10"
keywords = [
    "debian",
    "ubuntu",
    "server",
    "sysadmin",
    "automation",
    "security",
    "monitoring",
]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "pyyaml",
]

[project.urls]
Repository = "https://github.com/KmetZID/hostkeeper"
Issues = "https://github.com/KmetZID/hostkeeper/issues"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "pyyaml",
    "types-PyYAML",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.10"
platform = "linux"
strict = true
packages = ["hostkeeper"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
